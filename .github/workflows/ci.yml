name: Controle

# Draait bij elke pull request en bij elke wijziging op main. Slaagt dit niet,
# dan hoort de wijziging niet naar de live site.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    name: Lint, typecheck, contrast en tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pakketten installeren
        run: npm ci --no-audit --no-fund

      - name: Codecontrole
        run: npm run lint

      - name: Typecontrole
        run: npm run typecheck

      - name: Kleurcontrast (WCAG 2.2 AA)
        run: npm run check:contrast

      - name: Snelle tests
        run: npm run test:unit

      - name: Bouwen (verwerkt ook de foto's)
        run: npm run build

  browsertests:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pakketten installeren
        run: npm ci --no-audit --no-fund

      - name: Testbrowser ophalen
        run: npx playwright install --with-deps chromium

      - name: Bouwen (verwerkt ook de foto's)
        run: npm run build

      - name: Browsertests
        run: npm run test:e2e

      - name: Testrapport bewaren
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 14

  live:
    name: Live zetten
    # Draait alleen als er iets op main terechtkomt, en alleen als allebei de
    # controles hierboven groen zijn. Een kapotte versie gaat dus nooit live.
    #
    # Waarom dit hier staat en Vercel het niet zelf doet: Vercel bouwt een
    # prive-repository alleen als de schrijver van de commit ook toegang heeft
    # tot het Vercel-project, en op het gratis abonnement is dat precies een
    # persoon. Voegde iemand anders een pull request samen, dan bleef de site
    # staan waar hij stond. Deze stap zet hem live met een sleutel in plaats van
    # met een naam, dus het maakt niet meer uit wie de wijziging gemaakt heeft.
    #
    # vercel.json zet het automatisch live zetten door Vercel zelf uit voor
    # main, zodat het niet twee keer gebeurt.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [controle, browsertests]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Kijken of de drie sleutels klaarstaan
        run: |
          ontbreekt=""
          [ -n "$VERCEL_TOKEN" ] || ontbreekt="$ontbreekt VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || ontbreekt="$ontbreekt VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || ontbreekt="$ontbreekt VERCEL_PROJECT_ID"
          if [ -n "$ontbreekt" ]; then
            echo "::error::Nog niet ingesteld:$ontbreekt. Zet ze klaar onder Settings -> Secrets and variables -> Actions. In stappen: docs/samen-werken.md, 'Live zetten zonder dat Dennis erbij hoeft'."
            exit 1
          fi

      - name: Vercel-opdrachtregel installeren
        run: npm install --global vercel@latest

      - name: Instellingen van het project ophalen
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Bouwen (verwerkt ook de foto's)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Live zetten
        run: |
          adres=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "De nieuwe versie staat live."
          {
            echo "### Live gezet"
            echo ""
            echo "De site draait nu op <https://oogcontact.vercel.app>."
            echo ""
            echo "Deze versie: $adres"
          } >> "$GITHUB_STEP_SUMMARY"
